<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6f1e7"/>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; fill: #17212b; }
    .title { font-size: 42px; font-weight: 700; }
    .heading { font-size: 27px; font-weight: 700; }
    .body { font-size: 22px; }
    .small { font-size: 18px; }
    .box { stroke: #17212b; stroke-width: 3; rx: 18; }
    .arrow { stroke: #17212b; stroke-width: 5; fill: none; marker-end: url(#head); }
  </style>
  <defs>
    <marker id="head" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#17212b"/>
    </marker>
  </defs>
  <text x="600" y="70" text-anchor="middle" class="title">What should a test prove?</text>
  <rect x="390" y="115" width="420" height="105" fill="#ffffff" class="box"/>
  <text x="600" y="158" text-anchor="middle" class="heading">Existing assertion</text>
  <text x="600" y="193" text-anchor="middle" class="body">What evidence does it inspect?</text>
  <path d="M500 220 C430 275 320 270 245 315" class="arrow"/>
  <path d="M700 220 C770 275 880 270 955 315" class="arrow"/>
  <rect x="65" y="315" width="430" height="205" fill="#d9efe4" class="box"/>
  <text x="280" y="360" text-anchor="middle" class="heading">Machine evidence</text>
  <text x="95" y="405" class="body">JSON fields, exit status, files, modes,</text>
  <text x="95" y="439" class="body">Git state, commands, redaction, HTTP</text>
  <text x="280" y="488" text-anchor="middle" class="heading">KEEP</text>
  <rect x="705" y="315" width="430" height="205" fill="#f3d4ce" class="box"/>
  <text x="920" y="360" text-anchor="middle" class="heading">Human prose only</text>
  <text x="735" y="405" class="body">Substring, prefix, or exact wording</text>
  <text x="735" y="439" class="body">with no machine-readable contract</text>
  <text x="920" y="488" text-anchor="middle" class="heading">REMOVE</text>
  <path d="M920 520 L920 575" class="arrow"/>
  <rect x="655" y="575" width="530" height="90" fill="#e8def4" class="box"/>
  <text x="920" y="615" text-anchor="middle" class="heading">Future refinement</text>
  <text x="920" y="647" text-anchor="middle" class="small">Test how agents interpret guidance in real tasks</text>
  <text x="65" y="635" class="small">Scope: tests only. Runtime behavior and generated guidance do not change.</text>
</svg>
