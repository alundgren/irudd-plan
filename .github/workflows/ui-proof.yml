name: UI proof
on:
  pull_request:
    paths:
      - "src/web/**"
      - "src/contract/planning.ts"
      - "tests/browser/**"
      - "playwright.config.ts"
      - ".github/workflows/ui-proof.yml"
      - "package.json"
      - "pnpm-lock.yaml"
concurrency:
  group: ui-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: voidzero-dev/setup-vp@8a7496fd44e8a1b0a88a7459e36213b2fefc1d15 # v1
      - run: vp exec playwright install --with-deps chromium
      - run: vp run check:ci
      - run: vp run test
      - run: vp run test:ui-proof
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: evidence
        with:
          name: ui-proof-${{ github.event.pull_request.head.sha }}
          path: test-results/ui-proof/
          if-no-files-found: error
          retention-days: 30
      - name: Link evidence
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Visual proof for commit $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download short WebM clips and screenshots]($ARTIFACT_URL)" >> "$GITHUB_STEP_SUMMARY"
