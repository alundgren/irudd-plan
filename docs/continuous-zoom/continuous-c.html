<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Continuous zoom · recovered C revision</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      color: #604939;
      background: #f2eade;
      font:
        16px/1.6 system-ui,
        sans-serif;
    }
    button,
    select {
      font: inherit;
      color: inherit;
      cursor: pointer;
    }
    button {
      border: 1px solid #c1af9a;
      background: #f9f6f0;
      border-radius: 7px;
      padding: 7px 13px;
    }
    button:hover {
      background: #e0d2bd;
    }
    button:focus-visible {
      outline: 3px solid #3d5d71;
      outline-offset: 2px;
    }
    .top {
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 22px;
      border-bottom: 1px solid #c1af9a;
    }
    .brand {
      font-weight: 600;
    }
    .small {
      font-size: 13.5px;
      color: #66574d;
    }
    .top .small {
      margin-left: auto;
    }
    .study {
      padding: 18px 28px;
      background: #eadfcd;
      display: flex;
      gap: 30px;
      align-items: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .tabs button[aria-pressed="true"] {
      background: #784f26;
      color: #f9f6f0;
      border-color: #784f26;
    }
    .explain {
      max-width: 790px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .explain strong {
      display: block;
      font-size: 16px;
      font-weight: 600;
    }
    .workspace {
      height: calc(100dvh - 173px);
      min-height: 450px;
      position: relative;
      overflow: hidden;
      background-color: #eadfcd;
      background-image: radial-gradient(#c1af9a 0.7px, transparent 0.7px);
      background-size: 20px 20px;
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    .workspace.dragging {
      cursor: grabbing;
    }
    .world {
      position: absolute;
      transform-origin: 0 0;
    }
    .section {
      position: absolute;
      border: 1px solid #c1af9a;
      background: #f2eade;
      border-radius: 14px;
      padding: 55px 28px 28px;
    }
    .section.selected {
      border: 2px solid #784f26;
    }
    .content {
      display: flex;
      gap: 28px;
      align-items: flex-start;
    }
    .sheet {
      background: #f9f6f0;
      width: 510px;
      padding: 30px 34px;
      border-radius: 8px;
    }
    .sheet h2 {
      font-size: 22px;
      line-height: 1.3;
      margin: 0 0 25px;
      font-weight: 600;
    }
    .sheet h3 {
      font-size: 12px;
      letter-spacing: 0.07em;
      font-weight: 500;
      margin: 25px 0 10px;
    }
    .sheet p {
      margin: 0 0 12px;
    }
    .sheet ul {
      padding-left: 20px;
    }
    .sheet li {
      margin: 9px 0;
    }
    .decision {
      background: #eadfcd;
      padding: 16px;
      border-left: 3px solid #784f26;
    }
    .reference {
      width: 510px;
      padding: 20px;
      background: #f9f6f0;
      border-radius: 8px;
    }
    .reference img {
      width: 100%;
      display: block;
      margin-top: 15px;
    }
    .reference p {
      font-size: 13.5px;
      margin: 15px 0 0;
    }
    .reference strong {
      font-weight: 500;
    }
    .labels {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .label {
      transform: translateY(-100%);
      position: absolute;
      pointer-events: auto;
      text-align: left;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      padding: 7px 10px;
      background: #f2eade;
      border: 1px solid #c1af9a;
      box-shadow: none;
      max-width: 440px;
    }
    .label span {
      font-size: 12px;
      font-weight: 400;
      display: block;
      margin-top: 4px;
    }
    .tools {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 5px;
      padding: 7px;
      background: #f2eade;
      border: 1px solid #c1af9a;
      border-radius: 10px;
      align-items: center;
      white-space: nowrap;
    }
    .tools output {
      min-width: 55px;
      text-align: center;
      font-size: 13.5px;
    }
    .hint {
      position: absolute;
      left: 22px;
      top: 16px;
      font-size: 13.5px;
      background: #f2eade;
      padding: 5px 10px;
      border-radius: 5px;
      pointer-events: none;
    }
    .jump {
      position: absolute;
      right: 22px;
      top: 16px;
      padding: 7px;
      max-width: 220px;
      background: #f9f6f0;
      border: 1px solid #c1af9a;
      border-radius: 6px;
    }
    .summary {
      display: none;
    }
    .rows .section {
      background: transparent;
      border: 0;
      border-top: 2px solid #c1af9a;
      border-radius: 0;
      padding-top: 55px;
    }
    .rows .section.selected {
      border-color: #784f26;
    }
    .rows .label {
      transform: none;
      border: 0;
      border-left: 4px solid #784f26;
      border-radius: 0;
    }
    .compact.low .content {
      display: none;
    }
    .compact.low .summary {
      display: flex;
      gap: 22px;
      align-items: center;
      font-size: 34px;
      line-height: 1.5;
    }
    .summary img {
      width: 380px;
      border-radius: 7px;
    }
    .summary p {
      margin: 0;
    }
    .summary small {
      display: block;
      font-size: 26px;
      margin-top: 22px;
    }
    .compact.low .section {
      height: 430px !important;
      padding: 75px 35px 25px;
    }
    .compact.low .label {
      background: #e0d2bd;
    }
    .overview {
      position: absolute;
      background: #e0d2bd;
      border-radius: 12px;
      padding: 32px;
      width: 430px;
    }
    .overview h2 {
      font-weight: 600;
      font-size: 28px;
      line-height: 1.3;
      margin-top: 0;
    }
    .overview p {
      font-size: 17px;
    }
    .overview .small {
      font-size: 14px;
    }
    @media (max-width: 900px) {
      .top {
        padding: 10px 16px;
      }
      .study {
        padding: 12px 16px;
        display: block;
      }
      .explain {
        margin-top: 10px;
      }
      .workspace {
        height: calc(100dvh - 230px);
      }
      .top .small {
        display: none;
      }
      .hint {
        display: none;
      }
      .tabs button {
        padding: 6px 9px;
        font-size: 13.5px;
      }
      .jump {
        max-width: 170px;
        font-size: 13.5px;
      }
      .tools {
        bottom: 12px;
      }
      .tools button {
        padding: 6px 9px;
      }
    }

    .tabs {
      display: none;
    }
    .section {
      padding-top: 120px;
      overflow: hidden;
    }
    .label {
      transform: none;
      border-radius: 0;
      box-shadow: none;
      max-width: none;
      margin: 0;
    }
    .compact.low .section {
      min-height: 860px;
      height: auto !important;
    }
    .compact.low .summary {
      font-size: 32px;
    }
    .compact.low .summary img {
      width: 35%;
    }
    .compact.low .label {
      background: #e0d2bd;
    }
    .world .label {
      left: 0;
      top: 0;
      width: 100%;
      border: 0;
      border-bottom: 1px solid #c1af9a;
      background: #e0d2bd;
      z-index: 1;
    }
    .world .label span {
      font-size: 0.75em;
    }
    .world .section {
      border-radius: 10px;
    }
    .world .label {
      border-radius: 0;
    }
    .compact.low .content {
      display: none;
    }
  </style>
  <header class="top">
    <div class="brand">irudd plan</div>
    <div>Text-test cleanup</div>
    <div class="small">
      Design study · local mockup · sample content from your plan
    </div>
  </header>
  <div class="study">
    <nav class="tabs" aria-label="Design alternatives">
      <button data-mode="frames" aria-pressed="true">A · Framed sections</button
      ><button data-mode="rows" aria-pressed="false">B · Spacious rows</button
      ><button data-mode="compact" aria-pressed="false">
        C · Zoom summaries
      </button>
    </nav>
    <div class="explain" id="explain"></div>
  </div>
  <main
    class="workspace frames"
    id="canvas"
    aria-label="Interactive plan canvas"
  >
    <div class="world" id="world"></div>
    <div class="labels" id="labels"></div>
    <div class="hint">
      Drag to pan · Scroll to zoom around the pointer · Click a title to center
      its text
    </div>
    <select class="jump" id="jump" aria-label="Jump to item">
      <option value="-1">Jump to a section…</option>
    </select>
    <div class="tools" aria-label="Canvas controls">
      <button id="out" aria-label="Zoom out">−</button
      ><output id="zoom">40%</output
      ><button id="in" aria-label="Zoom in">+</button
      ><button id="fit">Fit all</button><button id="quarter">25%</button
      ><button id="actual">100%</button>
    </div>
  </main>
  <script>
    const items = [
      {
        title: "Remove prose-only assertions from fleet tests",
        short: "Fleet tests",
        goal: "Keep fleet tests focused on structured results and real effects.",
        detail:
          "Remove assertions that pass only because fleet output contains expected English wording while retaining structured state, command, security, and failure checks.",
        checks: [
          "Keep reasonCode, checkId, status, command ID, argv and observation assertions.",
          "Keep security non-leakage, refusal, no-write and no-fetch checks.",
          "Do not change fleet runtime behavior or diagnostic wording.",
        ],
        note: "1 open comment",
      },
      {
        title: "Remove prose-only assertions from local workflow tests",
        short: "Local workflow tests",
        goal: "Test installer and vault behavior through state changes.",
        detail:
          "Remove human-wording searches from installer, guidance synchronization, vault alias, and vault synchronization tests while preserving their behavioral evidence.",
        checks: [
          "Keep exit status, byte equality, checksums, file modes and backups.",
          "Keep alias targets, idempotency, Git propagation and commit survival.",
          "Do not modify generated guidance or runtime scripts.",
        ],
        note: "1 visual reference",
      },
      {
        title:
          "Remove prose-only assertions from Repo Control publishing tests",
        short: "Repo Control publishing tests",
        goal: "Test publishing failures through types and protocol behavior.",
        detail:
          "Remove assertions over human exception wording while preserving the behavior that makes publishing safe and recoverable.",
        checks: [
          "Keep exception types, HTTP methods, URLs and request counts.",
          "Keep retry behavior, exit status and connection cleanup.",
          "Keep secret, script and private-response non-leakage checks.",
        ],
        note: "1 visual reference",
      },
      {
        title: "Design evidence for agent interpretation",
        short: "Agent interpretation",
        goal: "Define credible trials for how agents use repository guidance.",
        detail:
          "Record the unresolved work needed to test whether agents interpret guidance correctly in real tasks.",
        checks: [
          "Identify representative tasks, runtimes and a scoring rubric.",
          "Decide repeatability requirements, cost limits and failure evidence.",
          "Keep implementation outside the current cleanup scope.",
        ],
        note: "Needs refinement",
      },
    ];
    const descriptions = {
      frames: [
        "A shared boundary makes ownership explicit.",
        "Each item and its image sit inside one section. Headers stay readable as you zoom out. Keeps the spatial layout, but large empty areas remain beside long documents.",
      ],
      rows: [
        "A predictable reading order with room for references.",
        "Each item gets its own horizontal row. Titles identify the whole row and images sit alongside the document. Easy to scan vertically, but fitting the entire plan makes documents much smaller.",
      ],
      compact: [
        "The overview changes with the zoom level.",
        "Below 45%, each section shows its goal and a reference thumbnail. Zoom in for the document. Easier to scan at a distance, but detail appears and disappears as you zoom.",
      ],
    };
    let mode = "compact",
      scale = 0.4,
      tx = 35,
      ty = 70,
      selected = 0,
      positions = [];
    const canvas = document.querySelector("#canvas"),
      world = document.querySelector("#world"),
      labels = document.querySelector("#labels");
    items.forEach((x, i) =>
      document.querySelector("#jump").add(new Option(x.short, i)),
    );
    function build() {
      canvas.className = "workspace " + mode;
      document.querySelector("#explain").innerHTML =
        "<strong>" +
        "Continuous zoom, attached headers.</strong>Recovered C interaction. The canvas stays in place as you zoom; distant items show summaries. Click a title to center its description. Minimum zoom is 22% to keep titles readable.";
      world.innerHTML =
        '<aside class="overview" style="left:0;top:0"><div class="small">PLAN OVERVIEW · 4 ITEMS</div><h2>Remove prose-only test assertions</h2><p>Keep evidence of machine behavior. Plan agent interpretation trials separately.</p><div class="small">Three cleanup items<br>One future refinement</div></aside>';
      labels.innerHTML = "";
      positions = items.map((x, i) =>
        mode === "rows"
          ? { x: 560, y: i * 1080, w: 1120, h: 860 }
          : {
              x: 560 + (i % 2) * 1370,
              y: Math.floor(i / 2) * 1440,
              w: 1120,
              h: 860,
            },
      );
      items.forEach((x, i) => {
        const p = positions[i];
        world.insertAdjacentHTML(
          "beforeend",
          `<section class="section ${i === selected ? "selected" : ""}" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px" aria-label="${x.title}"><div class="content"><article class="sheet"><h2>${x.title}</h2><h3>GOAL</h3><p>${x.detail}</p><h3>OPEN DECISION</h3><div class="decision">${i === 3 ? "Track agent evaluation as nonblocking refinement." : "Remove prose-only tests without replacement. Preserve machine and behavioral checks."}</div><h3>REQUIREMENTS</h3><ul>${x.checks.map((t) => "<li>" + t + "</li>").join("")}</ul><h3>CHECKS</h3><p>${i === 3 ? "Record the tasks, runtimes, rubric, costs and failure evidence needed for future refinement." : "Run the affected tests and review the retained behavioral evidence."}</p></article><aside class="reference"><strong>Acceptance reference</strong><img src="reference.svg" alt="Decision guide: keep machine evidence, remove human prose-only assertions, defer agent interpretation trials."><p>What should a test prove? Shared decision guide for this item.</p></aside></div><div class="summary"><div><p>${x.goal}</p><small>${i === 3 ? "Future refinement · Nonblocking" : "Cleanup · Behavioral checks retained"}</small></div><img src="reference.svg" alt="Test evidence decision guide"></div></section>`,
        );
        const b = document.createElement("button");
        b.className = "label";
        b.innerHTML = `${String(i + 1).padStart(2, "0")} · ${x.title}<span>${x.note} · Click to read</span>`;
        b.onclick = () => focus(i);
        labels.append(b);
      });
      draw();
    }
    function draw() {
      const low = mode === "compact" && scale < 0.45;
      canvas.classList.toggle("low", low);
      world.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
      [...labels.children].forEach((b, i) => {
        world.querySelectorAll(".section")[i].prepend(b);
      });
      world.querySelectorAll(".label").forEach((b) => {
        b.style.fontSize = Math.min(62, Math.max(18, 14 / scale)) + "px";
        b.style.padding = 10 / scale + "px";
        b.parentElement.style.paddingTop = b.offsetHeight + 28 + "px";
        const summary = b.parentElement.querySelector(".summary");
        summary.style.fontSize = Math.max(32, 13.5 / scale) + "px";
        summary.querySelector("small").style.fontSize =
          Math.max(26, 11 / scale) + "px";
      });
      document.querySelector("#zoom").textContent =
        Math.round(scale * 100) + "%";
    }
    function zoomTo(
      n,
      cx = canvas.clientWidth / 2,
      cy = canvas.clientHeight / 2,
    ) {
      n = Math.min(1.25, Math.max(0.22, n));
      tx = cx - ((cx - tx) * n) / scale;
      ty = cy - ((cy - ty) * n) / scale;
      scale = n;
      draw();
    }
    function fit() {
      let maxX = Math.max(...positions.map((p) => p.x + p.w)),
        maxY = Math.max(...positions.map((p) => p.y + p.h));
      scale = Math.min(
        (canvas.clientWidth - 70) / maxX,
        (canvas.clientHeight - 215) / maxY,
        0.7,
      );
      scale = Math.max(0.22, scale);
      tx = (canvas.clientWidth - maxX * scale) / 2;
      ty = 145;
      draw();
    }
    function focus(i) {
      selected = i;
      document
        .querySelectorAll(".section")
        .forEach((s, j) => s.classList.toggle("selected", i === j));
      scale = Math.min(1.1, (canvas.clientWidth - 60) / 578);
      tx =
        (canvas.clientWidth - 510 * scale) / 2 - (positions[i].x + 28) * scale;
      ty = 85 - positions[i].y * scale;
      document.querySelector("#jump").value = i;
      draw();
    }
    document.querySelectorAll("[data-mode]").forEach(
      (b) =>
        (b.onclick = () => {
          mode = b.dataset.mode;
          document
            .querySelectorAll("[data-mode]")
            .forEach((t) => t.setAttribute("aria-pressed", t === b));
          build();
          fit();
        }),
    );
    document.querySelector("#out").onclick = () => zoomTo(scale / 1.25);
    document.querySelector("#in").onclick = () => zoomTo(scale * 1.25);
    document.querySelector("#actual").onclick = () => zoomTo(1);
    document.querySelector("#quarter").onclick = () => zoomTo(0.25);
    document.querySelector("#fit").onclick = fit;
    document.querySelector("#jump").onchange = (e) => {
      if (+e.target.value >= 0) focus(+e.target.value);
    };
    canvas.addEventListener(
      "wheel",
      (e) => {
        if (e.target.closest("select")) return;
        e.preventDefault();
        const r = canvas.getBoundingClientRect();
        zoomTo(
          scale * Math.exp(-e.deltaY * 0.002),
          e.clientX - r.left,
          e.clientY - r.top,
        );
      },
      { passive: false },
    );
    let drag = null;
    canvas.onpointerdown = (e) => {
      if (e.target.closest("button,select")) return;
      drag = { x: e.clientX, y: e.clientY, tx, ty };
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add("dragging");
    };
    canvas.onpointermove = (e) => {
      if (!drag) return;
      tx = drag.tx + e.clientX - drag.x;
      ty = drag.ty + e.clientY - drag.y;
      draw();
    };
    canvas.onpointerup = canvas.onpointercancel = () => {
      drag = null;
      canvas.classList.remove("dragging");
    };
    window.addEventListener("resize", fit);
    build();
    fit();
  </script>
</html>
