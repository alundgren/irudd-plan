<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>C · Adaptive plan sections</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f2eade;
      color: #604939;
      font:
        16px/1.6 system-ui,
        sans-serif;
    }
    button,
    select {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      background: #f9f6f0;
      border: 1px solid #c1af9a;
      border-radius: 6px;
      padding: 7px 13px;
    }
    button:hover {
      background: #e0d2bd;
    }
    button:focus-visible,
    select:focus-visible {
      outline: 3px solid #3d5d71;
      outline-offset: 3px;
    }
    header.app {
      height: 62px;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid #c1af9a;
    }
    .muted {
      color: #66574d;
      font-size: 13.5px;
    }
    .app .muted {
      margin-left: auto;
    }
    .study {
      padding: 14px 28px;
      background: #eadfcd;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .study strong {
      font-weight: 600;
      white-space: nowrap;
    }
    .study p {
      margin: 0;
      max-width: 1000px;
      font-size: 13.5px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 28px;
      align-items: center;
      border-bottom: 1px solid #c1af9a;
    }
    .toolbar select {
      margin-left: auto;
      background: #f9f6f0;
      border: 1px solid #c1af9a;
      border-radius: 6px;
      padding: 8px;
      max-width: 270px;
    }
    .toolbar output {
      width: 55px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    button[aria-pressed="true"] {
      background: #784f26;
      color: #f9f6f0;
      border-color: #784f26;
    }
    .viewport {
      height: calc(100dvh - 212px);
      min-height: 350px;
      overflow: auto;
      background-color: #eadfcd;
      background-image: radial-gradient(#c1af9a 0.7px, transparent 0.7px);
      background-size: 20px 20px;
      padding: 30px 36px 70px;
      scrollbar-gutter: stable;
    }
    .context {
      max-width: 1120px;
      margin: 0 auto 25px;
      display: flex;
      gap: 24px;
      align-items: baseline;
    }
    .context h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0;
    }
    .context span {
      font-size: 13.5px;
    }
    .grid {
      max-width: 1120px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 36px;
    }
    .frame {
      background: #f2eade;
      border: 1px solid #c1af9a;
      border-radius: 10px;
      overflow: hidden;
      min-width: 0;
    }
    .bar {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      width: 100%;
      border: 0;
      border-bottom: 1px solid #c1af9a;
      border-radius: 0;
      background: #e0d2bd;
      text-align: left;
      padding: 16px 20px;
      line-height: 1.4;
      font-weight: 600;
      min-height: 78px;
    }
    .bar .number {
      font-weight: 400;
      color: #66574d;
    }
    .bar .title {
      flex: 1;
      min-width: 0;
    }
    .bar .arrow {
      flex: none;
    }
    .body {
      padding: 24px;
    }
    .summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 20px;
      align-items: start;
    }
    .summary p {
      margin: 0 0 16px;
    }
    .summary img {
      width: 100%;
      border: 1px solid #c1af9a;
      border-radius: 5px;
    }
    .meta {
      font-size: 13.5px;
      color: #66574d;
    }
    .reading .grid {
      display: block;
      max-width: 860px;
    }
    .reading .bar {
      position: sticky;
      top: 0;
      z-index: 1;
      min-height: 0;
    }
    .reading .frame {
      overflow: visible;
    }
    .reading .body {
      max-width: 740px;
      margin: auto;
      padding: 30px 32px;
      font-size: var(--reading-font, 16px);
    }
    h2 {
      font-weight: 600;
      font-size: 22px;
      margin: 0 0 12px;
    }
    h3 {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.04em;
      margin: 30px 0 10px;
    }
    p {
      margin: 0 0 18px;
    }
    li {
      margin: 10px 0;
    }
    .decision {
      padding: 18px;
      background: #eadfcd;
      border-left: 3px solid #784f26;
    }
    .reference {
      margin-top: 35px;
      border-top: 1px solid #c1af9a;
      padding-top: 25px;
    }
    .reference img {
      width: 100%;
      display: block;
      margin: 18px 0;
    }
    .reference h3 {
      margin-top: 0;
    }
    .reading .context {
      max-width: 860px;
    }
    .sheet {
      background: #f9f6f0;
      padding: 24px;
      border-radius: 6px;
    }
    .canvas-mode .grid {
      max-width: 1500px;
      gap: 60px;
    }
    .canvas-mode .body {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
      gap: 22px;
      font-size: 14px;
    }
    .canvas-mode .reference {
      margin: 0;
      padding: 0;
      border: 0;
    }
    .canvas-mode .reference img {
      margin-top: 10px;
    }
    .canvas-mode .body h3 {
      font-size: 12px;
    }
    .canvas-mode .body h2 {
      font-size: 18px;
    }
    .canvas-mode .sheet {
      padding: 18px;
    }
    .reading .sheet {
      background: transparent;
      padding: 0;
    }
    .reading .context a {
      color: #3d5d71;
    }
    .state {
      padding: 5px 10px;
      border-radius: 5px;
      background: #f2eade;
      font-size: 13.5px;
    }
    .note {
      margin: 20px auto 0;
      max-width: 1120px;
      font-size: 13.5px;
      color: #66574d;
    }
    @media (max-width: 800px) {
      header.app {
        padding: 10px 16px;
      }
      .app .muted {
        display: none;
      }
      .study {
        display: block;
        padding: 10px 16px;
      }
      .toolbar {
        padding: 10px 16px;
      }
      .toolbar select {
        max-width: 180px;
      }
      .viewport {
        padding: 22px 16px 70px;
        height: calc(100dvh - 260px);
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .context {
        display: block;
      }
      .canvas-mode .body {
        grid-template-columns: 1fr;
      }
      .summary {
        grid-template-columns: minmax(0, 1fr) 100px;
      }
      .reading .body {
        padding: 24px;
      }
      .bar {
        padding: 14px;
        min-height: 0;
      }
      .state {
        display: none;
      }
    }
  </style>
  <header class="app">
    <strong>irudd plan</strong><span>Text-test cleanup</span
    ><span class="muted">C · Revised design study · Local mockup</span>
  </header>
  <div class="study">
    <strong>Sections at every distance</strong>
    <p>
      Full-width title bars. A readable overview below 35%. A centered reading
      column from 85%, with the reference below the description.
    </p>
  </div>
  <nav class="toolbar" aria-label="Zoom and navigation">
    <button id="minus" aria-label="Zoom out">−</button
    ><output id="zoom">25%</output
    ><button id="plus" aria-label="Zoom in">+</button
    ><button data-zoom="8">Far out</button
    ><button data-zoom="25">Overview</button
    ><button data-zoom="60">Sections</button
    ><button data-zoom="100">Read</button><span class="state" id="state"></span
    ><select id="jump" aria-label="Select item"></select>
  </nav>
  <main id="view" class="viewport">
    <div class="context">
      <h1 id="heading"></h1>
      <span id="context"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="note" id="note"></p>
  </main>
  <script>

    function render() {
      const reading = zoom >= 85,
        overview = zoom < 35;
      view.className =
        "viewport " +
        (reading ? "reading" : overview ? "overview-mode" : "canvas-mode");
      view.style.setProperty(
        "--reading-font",
        Math.min(22, 16 + (zoom - 85) / 20) + "px",
      );
      document.querySelector("#zoom").textContent = zoom + "%";
      document.querySelector("#state").textContent = reading
        ? "Reading view"
        : overview
          ? "Overview layout"
          : "Section layout";
      document.querySelector("#heading").textContent = reading
        ? items[selected].short
        : "Remove prose-only test assertions";
      document.querySelector("#context").innerHTML = reading
        ? '<a href="#reference-' + selected + '">Jump to reference ↓</a>'
        : "4 items · 3 cleanup items · 1 future refinement";
      document.querySelector("#note").textContent = overview
        ? "Overview keeps a minimum readable size. Zooming further out preserves this layout; larger plans continue vertically."

          ? "Text size increases up to 22px. The description stays centered and wraps within the frame. Scroll to read the reference."

    function setZoom(n) {
      zoom = Math.max(8, Math.min(200, n));
      render();
      view.scrollTop = 0;
    }
    document
      .querySelectorAll("[data-zoom]")
      .forEach((b) => (b.onclick = () => setZoom(+b.dataset.zoom)));
    document.querySelector("#minus").onclick = () =>
      setZoom([...steps].reverse().find((s) => s < zoom) ?? 8);
    document.querySelector("#plus").onclick = () =>
      setZoom(steps.find((s) => s > zoom) ?? 200);
    document.querySelector("#jump").onchange = (e) => {
      selected = +e.target.value;
      setZoom(100);
    };
    view.addEventListener(
      "wheel",
      (e) => {
        if (!e.ctrlKey && !e.metaKey) return;
        e.preventDefault();
        setZoom(
          e.deltaY > 0
            ? ([...steps].reverse().find((s) => s < zoom) ?? 8)
            : (steps.find((s) => s > zoom) ?? 200),
        );
      },
      { passive: false },
    );
