<text x="974" y="389" class="name">Plan backend</text>
<text x="974" y="425">Validate + version</text>
<text x="974" y="456">Read + write plans</text>
<path d="M 844 322 H 888 V 389 H 950" class="wire"/>
<path d="M 844 457 H 950" class="wire"/>
<path d="M 844 635 H 888 V 478 H 950" class="wire"/>
